[package]
name = "nitride-firmware"
version = "0.1.0"
edition = "2021"
license = "CERN-OHL-S-2.0"
default-run = "nitride-firmware"

[lib]
name = "nitride_firmware"
path = "src/lib.rs"

[[bin]]
name = "nitride-firmware"
path = "src/main.rs"

[dependencies]
log = "0.4"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embedded-hal = "1.0"
embedded-hal-async = "1.0"

embassy-executor = { version = "0.8", features = [
    "arch-cortex-m",
    "executor-thread",
] }
embassy-sync = { version = "0.6" }
static_cell = "2"
embassy-time = { version = "0.4" }
embassy-futures = "0.1"
embassy-stm32 = { version = "0.3", features = [
    "stm32g474ce",
    "single-bank",
    "memory-x",
    "time-driver-any",
    "unstable-pac",
    "exti",
] }
libm = "0.2"
ssd1306 = "0.8"  # Added SSD1306 dependency

defmt = "0.3"
# disable-blocking-mode: with the default blocking RTT the executor freezes
# ~3-4 s after boot whenever no probe-rs reader drains the buffer (the RTT
# control block and its "host connected" flag live in `.uninit` and survive
# resets, so one probe session wedges every later boot). Logs are dropped
# instead of blocking — RTT still streams when probe-rs is attached.
defmt-rtt = { version = "0.4", features = ["disable-blocking-mode"] }
panic-probe = { version = "0.3", features = ["print-defmt"] }

[build-dependencies]
embassy-stm32 = { version = "0.3", features = ["stm32g474ce", "single-bank"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
opt-level = "s"